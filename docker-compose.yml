services:
  java-springboot-multitenant-template:
    build: .
    ports:
      - "9942:9942"
    environment:
      # dev profile reads configuration from environment variables (QCP rule)
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_OPTS=-Xms256m -Xmx512m
      # SYSTEM (superadmin) database — tenant registry; user needs CREATEDB + CREATEROLE
      - DB_URL=jdbc:postgresql://postgres:5432/mt-template-system-db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      # Host/port seeded into the registry db_url values (tenant DBs live on the same server)
      - DB_HOST=postgres
      - DB_PORT=5432
      # Per-tenant DB credentials (relaxed binding → qcp.multitenancy.tenants.<code>.*)
      # Local/dev only — use secrets management (Vault) on real environments
      - QCP_MULTITENANCY_TENANTS_QC_DBUSERNAME=qc_user
      - QCP_MULTITENANCY_TENANTS_QC_DBPASSWORD=qc_pass
      - QCP_MULTITENANCY_TENANTS_CLIENT1_DBUSERNAME=client1_user
      - QCP_MULTITENANCY_TENANTS_CLIENT1_DBPASSWORD=client1_pass
      - QCP_MULTITENANCY_TENANTS_CLIENT2_DBUSERNAME=client2_user
      - QCP_MULTITENANCY_TENANTS_CLIENT2_DBPASSWORD=client2_pass
      # Identity — passed through from the shell or .env rather than written here, because the
      # realm and platform tenant differ per environment. See .env.example for what each is, and
      # RUN-WITH-IDENTITY-PORTAL.md for when the platform tenant is set at all.
      - KEYCLOAK_SERVER_URL=http://localhost:8080
      - KEYCLOAK_REALM=master
      - KEYCLOAK_PLATFORM_TENANT=${KEYCLOAK_PLATFORM_TENANT:-}
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Host grammar and CORS: both are per product, and neither has a default worth shipping.
      - QCP_HOST_PRODUCT=${QCP_HOST_PRODUCT:-}
      - QCP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS=${QCP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:-}
      - VAULT_ENABLED=${VAULT_ENABLED:-false}
      # Batch-upload chunk publishing (BatchChunkPublisher) — the kafka service below, shared
      # with validation-service.
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Must match validation-service's validation-service.kafka.topics.batch-validation-completed
      # default (data-validation-completed-topic) — BatchValidationCompletedListener consumes it.
      - KAFKA_TOPIC_BATCH_VALIDATION_COMPLETED=data-validation-completed-topic
      # BatchValidationCompletedListener pulls row-wise results from validation-service's REST API
      # once a batch completes — internal container network address, not the host-mapped 9943.
      - VALIDATION_SERVICE_BASE_URL=http://validation-service:9942
      # LOCAL-DEV-ONLY escape hatch (see DevBypassAuthenticationFilter): no Keycloak container in
      # this stack, so an unauthenticated request is treated as a trusted admin actor instead of
      # being rejected. Override which actor with the X-Dev-Actor-Id / X-Dev-Actor-Role request
      # headers. Set to false (or delete this line) once Keycloak is wired up. NEVER set this on
      # anything but a machine you're developing on.
      - APP_SECURITY_DEV_BYPASS_ENABLED=${APP_SECURITY_DEV_BYPASS_ENABLED:-true}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    # Pinned to the same version, and through the same variable, as the server stack in
    # ibs-deployment-console. Local used to run postgres:15 while every server ran 17, and the
    # two majors in between changed what CREATEROLE grants: tenant provisioning worked locally
    # and failed on the server with "must be able to SET ROLE". A local database that behaves
    # differently from the real one is worse than no local database, because it produces
    # confident green runs that prove nothing.
    #
    # Raise this deliberately, together with the servers — never let them drift apart again.
    image: postgres:${POSTGRES_VERSION:-17.6}
    environment:
      - POSTGRES_DB=mt-template-system-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres  # Local development only - use secrets in production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates validation-service-db alongside mt-template-system-db on first init only (see
      # the script's own header) — validation-service shares this container, own database.
      - ./script/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mt-template-system-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-broker KRaft-mode Kafka (no Zookeeper), shared by this app (producer) and
  # validation-service (consumer) below. Copied as-is from validation-service's own
  # docker-compose.yml so both stacks agree on the same broker shape.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web UI for the kafka broker above — browse topics, partitions, messages, consumer groups.
  # Not part of any service's runtime path; local-dev convenience only.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Separate repo, separate deployable — built from the sibling checkout, not this one. Requires
  # validation-service to be checked out next to this repo (../validation-service); this compose
  # file won't build without it. Shares the postgres container above (own database,
  # validation-service-db, created by script/postgres-init/01-create-validation-service-db.sql)
  # rather than running a second Postgres — one local Postgres server, one DB per service.
  validation-service:
    build: ../validation-service
    ports:
      - "9943:9942"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_OPTS=-Xms256m -Xmx512m
      - DB_URL=jdbc:postgresql://postgres:5432/validation-service-db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Must match this app's qcp.kafka.topics.batch-chunk default (data-validation-requested-topic).
      - KAFKA_TOPIC_BATCH_CHUNK=data-validation-requested-topic
      # Must match this app's qcp.kafka.topics.batch-validation-completed default.
      - KAFKA_TOPIC_BATCH_VALIDATION_COMPLETED=data-validation-completed-topic
    volumes:
      - ../validation-service/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
