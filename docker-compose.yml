services:
  java-springboot-multitenant-template:
    build: .
    ports:
      - "9942:9942"
    environment:
      # dev profile reads configuration from environment variables (QCP rule)
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_OPTS=-Xms256m -Xmx512m
      # SYSTEM (superadmin) database — tenant registry; user needs CREATEDB + CREATEROLE
      - DB_URL=jdbc:postgresql://postgres:5432/diy-batch-upload-db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      # Host/port seeded into the registry db_url values (tenant DBs live on the same server)
      - DB_HOST=postgres
      - DB_PORT=5432
      # Per-tenant DB credentials (relaxed binding → qcp.multitenancy.tenants.<code>.*)
      # Local/dev only — use secrets management (Vault) on real environments
      - QCP_MULTITENANCY_TENANTS_QC_DBUSERNAME=qc_user
      - QCP_MULTITENANCY_TENANTS_QC_DBPASSWORD=qc_pass
      - QCP_MULTITENANCY_TENANTS_CLIENT1_DBUSERNAME=client1_user
      - QCP_MULTITENANCY_TENANTS_CLIENT1_DBPASSWORD=client1_pass
      - QCP_MULTITENANCY_TENANTS_CLIENT2_DBUSERNAME=client2_user
      - QCP_MULTITENANCY_TENANTS_CLIENT2_DBPASSWORD=client2_pass
      # Identity — passed through from the shell or .env rather than written here, because the
      # realm and platform tenant differ per environment. See .env.example for what each is, and
      # RUN-WITH-IDENTITY-PORTAL.md for when the platform tenant is set at all.
      #
      # http://keycloak:8080 (the compose service name), not localhost — this app container
      # reaches Keycloak over the Docker network, not through the host's port mapping. A browser
      # only enters the picture for identity-portal's redirect flows (RUN-WITH-IDENTITY-PORTAL.md);
      # this own-Keycloak path is password-grant, proxied entirely through this backend.
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=admin-local
      - KEYCLOAK_SUPER_ADMIN_REALM=admin-local
      - KEYCLOAK_PLATFORM_TENANT=${KEYCLOAK_PLATFORM_TENANT:-}
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Host grammar and CORS: both are per product, and neither has a default worth shipping.
      - QCP_HOST_PRODUCT=${QCP_HOST_PRODUCT:-}
      - QCP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS=${QCP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:-}
      - VAULT_ENABLED=${VAULT_ENABLED:-false}
      # Batch-upload chunk publishing (BatchChunkPublisher) — the kafka service below, shared
      # with diy-validation-service. Producer only: the completion leg is a plain HTTP callback
      # (controller.BatchUploadController), not a Kafka consumer, so no completed-topic env var here.
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # ValidationServiceResultsClient pulls row-wise results from diy-validation-service's REST API
      # once its validation-completed callback lands — internal container network address, not the
      # host-mapped 9943.
      - VALIDATION_SERVICE_BASE_URL=http://diy-validation-service:9942
      # LOCAL-DEV-ONLY escape hatch (see DevBypassAuthenticationFilter): when true, an
      # unauthenticated request is treated as a trusted admin actor instead of being rejected.
      # Off by default now that the keycloak service below is wired up and verified — override
      # with APP_SECURITY_DEV_BYPASS_ENABLED=true only if Keycloak itself is down and you need
      # to keep testing unrelated endpoints. NEVER set this on anything but a machine you're
      # developing on.
      - APP_SECURITY_DEV_BYPASS_ENABLED=${APP_SECURITY_DEV_BYPASS_ENABLED:-false}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started

  # This service's own Keycloak — one realm per tenant (RUN-WITH-IDENTITY-PORTAL.md path (a)),
  # not identity-portal-service. --import-realm loads script/keycloak/import/*.json on startup:
  # admin-local (system/admin scope) plus one realm per tenant.tenants row
  # (V1_1_20__seed_tenants.sql: qc, client1, client2), each with a `{realm}-backend` client
  # (secret "secret", matching application-dev.yaml's client-secrets fallback above) and two
  # test users, {realm}.maker / {realm}.checker (password Test@1234), covering the four-eyes
  # roles DevBypassAuthenticationFilter otherwise fabricates. start-dev only, and re-importing an
  # existing realm on every restart is a dev-mode convenience — do not run this image this way
  # anywhere but here.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8080:8080"
    volumes:
      - ./script/keycloak/import:/opt/keycloak/data/import:ro

  postgres:
    # Pinned to the same version, and through the same variable, as the server stack in
    # ibs-deployment-console. Local used to run postgres:15 while every server ran 17, and the
    # two majors in between changed what CREATEROLE grants: tenant provisioning worked locally
    # and failed on the server with "must be able to SET ROLE". A local database that behaves
    # differently from the real one is worse than no local database, because it produces
    # confident green runs that prove nothing.
    #
    # Raise this deliberately, together with the servers — never let them drift apart again.
    image: postgres:${POSTGRES_VERSION:-17.6}
    environment:
      - POSTGRES_DB=diy-batch-upload-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres  # Local development only - use secrets in production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates diy-validation-system-db alongside diy-batch-upload-db on first init only (see
      # the script's own header) — diy-validation-service shares this container, own database.
      - ./script/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diy-batch-upload-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-broker KRaft-mode Kafka (no Zookeeper), shared by this app (producer) and
  # diy-validation-service (consumer) — diy-validation-service is NOT defined in this file (see
  # the note below); it runs from its own docker-compose.yml and joins this stack's network
  # (upload-services-net there) to reach this broker as kafka:29092. Copied as-is from
  # diy-validation-service's own docker-compose.yml so both stacks agree on the same broker shape.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Web UI for the kafka broker above — browse topics, partitions, messages, consumer groups.
  # Not part of any service's runtime path; local-dev convenience only.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # diy-validation-service is NOT defined here — it has its own, complete docker-compose.yml
  # (in ../diy-validation-service) that joins this stack's network as an external network named
  # diy-upload-services_default (Compose's default naming for this file's directory), reusing
  # this postgres/kafka/keycloak rather than duplicating them. An earlier, incomplete copy of
  # that service used to live in this block (missing KEYCLOAK_*/VAULT_ENABLED/
  # DIY_UPLOAD_SERVICE_BASE_URL/DB_HOST/DB_PORT, and the wrong DB name diy-validation-service-db)
  # — removed in favor of the one purpose-built for this integration. Start this stack first,
  # then `docker compose up` in ../diy-validation-service.

volumes:
  postgres_data:
  kafka_data:
